<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Exercícios - Engenharia Elétrica</title>

    <!-- Configuração do MathJax para reconhecer o delimitador $...$ inline -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']]
        }
      };
    </script>
    <!-- Inclusão da biblioteca do MathJax -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { background-color: #525659; font-family: Arial, sans-serif; padding: 20px; margin: 0; }

        .folha-a4 {
            background-color: white; width: 210mm; min-height: 297mm;
            padding: 20mm; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            box-sizing: border-box; margin: 0 auto 30px auto;
        }

        .cabecalho { text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 30px; }
        .cabecalho h1 { font-size: 22px; margin: 5px 0; }
        .cabecalho p { font-size: 14px; margin: 3px 0; }

        .aluno-box { border: 1px solid #000; padding: 10px; margin-bottom: 30px; font-size: 14px; }

        .questao { margin-bottom: 30px; line-height: 1.6; font-size: 15px; text-align: justify; }

        .botoes-acao { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .btn { background-color: #2980b9; color: white; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
        .btn:hover { background-color: #1a5276; }

        .btn-gerar { background-color: #f39c12; }
        .btn-gerar:hover { background-color: #d35400; }

        .btn-gabarito { background-color: #27ae60; }
        .btn-gabarito:hover { background-color: #1e8449; }
        .btn-fechar { background-color: #e74c3c; }
        .btn-fechar:hover { background-color: #c0392b; }

        #secao-gabarito { display: none; }

        .gabarito-item {
            border-bottom: 1px dashed #ccc; padding: 15px 0; font-size: 14px; line-height: 1.6;
        }

        @media print {
            body { background-color: white; padding: 0; }
            .folha-a4 { box-shadow: none; width: 100%; min-height: auto; padding: 0; margin: 0; }
            .botoes-acao { display: none !important; }
            .quebra-pagina { page-break-before: always; margin-top: 20mm; }
        }
    </style>
</head>
<body>

    <!-- BOTÕES DE CONTROLE LATERAIS -->
    <div class="botoes-acao">
        <button class="btn btn-gerar" onclick="regerarValores()">Gerar Novos Valores</button>
        <button class="btn" onclick="window.print()">Salvar como PDF</button>
        <button class="btn btn-gabarito" onclick="toggleGabarito()">Gerar Gabarito</button>
        <button class="btn btn-fechar" onclick="fecharJanela()">Fechar Aba</button>
    </div>

    <!-- FOLHA DO ALUNO -->
    <div class="folha-a4">
        <div class="cabecalho">
            <h1>Instituto Federal Fluminense - SETEC/MEC</h1>
            <p><strong>Sistema Didático para Aprendizagem de Engenharia Elétrica</strong></p>
            <p>Prof. Helder Siqueira Carvalho, MSc</p>
        </div>

        <div class="aluno-box">
            <p><strong>Nome do Aluno:</strong> </p>
            <p><strong>Data:</strong> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>Turma:</strong> </p>
        </div>

        <h3 style="text-align: center; margin-bottom: 25px;">Lista de Exercícios - Circuitos CA</h3>

        <div id="container-questoes-aluno"></div>
    </div>

    <!-- FOLHA DO GABARITO -->
    <div id="secao-gabarito">
        <div class="folha-a4 quebra-pagina">
            <div class="cabecalho">
                <h1>Gabarito Automático</h1>
                <p><strong>Uso Exclusivo do Professor (Gabarito de Respostas)</strong></p>
            </div>

            <div id="container-questoes-gabarito"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function toggleGabarito() {
            const gabarito = document.getElementById('secao-gabarito');
            if (gabarito.style.display === 'none' || gabarito.style.display === '') {
                gabarito.style.display = 'block';
                gabarito.scrollIntoView({ behavior: 'smooth' });
            } else {
                gabarito.style.display = 'none';
            }
        }

        function fecharJanela() {
            window.close();
        }

        function regerarValores() {
            window.location.reload();
        }
    </script>
</body>
</html>
