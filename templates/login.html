<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Análise CA</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #fff; }
        .login-container { background-color: #34495e; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 100%; max-width: 350px; text-align: center; }
        h2 { margin-top: 0; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: none; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .flash { color: #e74c3c; margin-bottom: 15px; font-size: 0.9rem; }
        a { color: #bdc3c7; text-decoration: none; font-size: 0.85rem; display: block; margin-top: 15px; }
        a:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Acesso ao SDAEE</h2>

        <!-- Mostra mensagens de erro (flash) -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Usuário" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>

    </div>
</body>
</html>
